<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset='UTF-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Custom Order Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding: 30px; }
        #result { margin-top: 20px; padding: 15px; background: #f5f5f5; border-radius: 5px; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Test Custom Order Form Submission</h1>
        
        <form id="testForm" enctype="multipart/form-data" method="POST" action="pages/api-custom-order.php">
            <div class="mb-3">
                <label class="form-label">Tên:</label>
                <input type="text" name="customer_name" value="Nguyễn Văn A" class="form-control" placeholder="Nhập tên" required>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Email:</label>
                <input type="email" name="customer_email" value="test@example.com" class="form-control" placeholder="Nhập email" required>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Điện thoại:</label>
                <input type="tel" name="customer_phone" value="0908123456" class="form-control" placeholder="Nhập điện thoại" required>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Mẫu tìm kiếm:</label>
                <input type="text" name="search_keyword" value="Gấu hương dương" class="form-control" placeholder="Nhập mẫu tìm kiếm" required>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Mô tả:</label>
                <textarea name="description" class="form-control" rows="5" placeholder="Nhập mô tả" required>Mô tả test về gấu hương dương</textarea>
            </div>
            
            <button type="submit" class="btn btn-primary">🚀 Test Submit</button>
        </form>
        
        <hr>
        
        <h2>AJAX Test (không page reload):</h2>
        <button onclick="testAjax()" class="btn btn-success">🧪 Test AJAX Submit</button>
        
        <div id="result">
            <h3>Response:</h3>
            <pre id="resultContent"></pre>
        </div>
    </div>
    
    <script>
    async function testAjax() {
        const form = document.getElementById('testForm');
        const formData = new FormData(form);
        
        try {
            const response = await fetch('pages/api-custom-order.php', {
                method: 'POST',
                body: formData
            });
            
            // Đọc body chỉ một lần
            const responseText = await response.text();
            
            document.getElementById('result').style.display = 'block';
            document.getElementById('resultContent').textContent = 
                'Status: ' + response.status + '\n\n' + responseText;
            
            // Try to parse as JSON
            try {
                const data = JSON.parse(responseText);
                document.getElementById('resultContent').textContent = 
                    'Status: ' + response.status + '\n\n' + 
                    JSON.stringify(data, null, 2);
                    
                if (data.success) {
                    alert('✅ Thành công! ID: ' + data.custom_order_id);
                } else {
                    alert('❌ Lỗi: ' + data.message);
                }
            } catch (parseError) {
                console.error('JSON parse error:', parseError);
                document.getElementById('resultContent').textContent = 
                    'Status: ' + response.status + ' (Not JSON)\n\n' + responseText;
            }
        } catch (error) {
            document.getElementById('result').style.display = 'block';
            document.getElementById('resultContent').textContent = 'Error: ' + error.message;
        }
    }
    </script>
</body>
</html>
